name: Train and evaluate SMS baseline

on:
  workflow_dispatch:
  push:
    paths:
      - "ml/**"
      - ".github/workflows/model-evaluation.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: python -m pip install --upgrade pip && pip install -r ml/requirements.txt

      - name: Train and evaluate
        run: python ml/train_evaluate.py

      - name: Upload evaluation results and model
        uses: actions/upload-artifact@v4
        with:
          name: PayPause-SMS-baseline-evaluation
          path: |
            ml/artifacts/metrics.json
            ml/artifacts/sms_spam_baseline.joblib
            ml/artifacts/sms_spam_baseline.onnx
          if-no-files-found: error
          retention-days: 30
