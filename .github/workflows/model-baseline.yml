name: Model baseline tests
on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "model_api/**"
      - ".github/workflows/model-baseline.yml"
  pull_request:
    paths:
      - "ml/**"
      - "model_api/**"
      - ".github/workflows/model-baseline.yml"
jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            model_api/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt -r model_api/requirements.txt
      - name: Train and evaluate held-out baseline
        run: python ml/train_evaluate.py
      - name: Validate trained model and risk-signal smoke tests
        run: python -m unittest model_api.test_smoke -v
      - name: Validate ONNX artifact if exported
        run: |
          python - <<'PY'
          from pathlib import Path
          import onnx
          p = Path("ml/artifacts/sms_spam_baseline.onnx")
          if p.exists():
              onnx.checker.check_model(onnx.load(str(p)))
              print("ONNX checker passed")
          else:
              raise SystemExit("Expected ONNX export was not produced")
          PY
